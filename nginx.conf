server {
    listen 8080;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html index.htm;

    include /etc/nginx/snippets/security-headers.conf;

    # Hardening: static site, so only GET/HEAD; short timeouts; tiny request bodies
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;

    # Never serve dotfiles (.git, .env, ...)
    location ~ /\. { deny all; return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Static assets: long cache. add_header in a location drops inherited headers, so re-include.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public";
    }
}
